name: Sync & Filter FleaMarket Plugin

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Fetch and Clean with Regex Matching
        run: |
          python3 -c '
          from curl_cffi import requests
          import re
          import sys

          url = "https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx"
          headers = {
              "User-Agent": "Loon/786 CFNetwork/1568.200.51 Darwin/24.1.0",
              "Accept": "*/*"
          }

          try:
              res = requests.get(url, headers=headers, impersonate="safari15_5", timeout=15)
              
              if res.status_code == 200 and ("recommend" in res.text or "[Plugin]" in res.text):
                  lines = res.text.splitlines()
                  # 使用正则表达式匹配过滤，无视 \. 转义符与大小写
                  cleaned_lines = [line for line in lines if not re.search(r"recommend.*list", line, re.IGNORECASE)]
                  cleaned_content = "\n".join(cleaned_lines)
                  
                  removed_count = len(lines) - len(cleaned_lines)
                  if removed_count > 0:
                      print(f"✅ 成功过滤掉 {removed_count} 行匹配规则！")
                  else:
                      print("⚠️ 未匹配到目标规则行，请检查文本格式")

                  with open("FleaMarket_clean.plugin", "w", encoding="utf-8") as f:
                      f.write(cleaned_content)
              else:
                  print(f"❌ 抓取失败，状态码: {res.status_code}")
                  sys.exit(1)
          except Exception as e:
              print(f"❌ 发生异常: {e}")
              sys.exit(1)
          '

      - name: Commit and push cleaned plugin
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FleaMarket_clean.plugin
          git commit -m "Fix regex filtering for recommend.list rule" || exit 0
          git push
