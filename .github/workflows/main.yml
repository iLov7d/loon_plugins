name: Sync & Filter FleaMarket Plugin

on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Fetch and Clean with TLS Spoofing
        run: |
          python3 -c '
          from curl_cffi import requests
          import sys

          url = "https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx"
          # 使用你截图中完全一致的特征 User-Agent
          headers = {
              "User-Agent": "Loon/786 CFNetwork/1568.200.51 Darwin/24.1.0",
              "Accept": "*/*"
          }

          try:
              # impersonate="safari15_5" 会完美伪装 iOS/Safari 的底层 TLS 握手指纹
              res = requests.get(url, headers=headers, impersonate="safari15_5", timeout=15)
              
              if res.status_code == 200 and ("recommend.list" in res.text or "[Plugin]" in res.text or "[Rewrite]" in res.text):
                  print("✅ 成功匹配 TLS 指纹与特征 UA，穿透 Cloudflare！正在剔除推荐栏目...")
                  # 过滤掉包含 recommend.list 的行
                  lines = res.text.splitlines()
                  cleaned_lines = [line for line in lines if "recommend.list" not in line]
                  cleaned_content = "\n".join(cleaned_lines)
                  
                  with open("FleaMarket_clean.plugin", "w", encoding="utf-8") as f:
                      f.write(cleaned_content)
              else:
                  print(f"❌ 抓取失败，状态码: {res.status_code}")
                  print("返回前 300 字符：\n", res.text[:300])
                  sys.exit(1)
          except Exception as e:
              print(f"❌ 发生异常: {e}")
              sys.exit(1)
          '

      - name: Commit and push cleaned plugin
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FleaMarket_clean.plugin
          git commit -m "Auto update: remove recommend.list rule via TLS & UA spoofing" || exit 0
          git push
