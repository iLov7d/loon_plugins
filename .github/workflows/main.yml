- name: Fetch and Clean
        run: |
          python3 -c '
          from curl_cffi import requests
          import re
          import sys

          url = "https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx"
          headers = {
              "User-Agent": "Loon/786 CFNetwork/1568.200.51 Darwin/24.1.0",
              "Accept": "*/*"
          }

          try:
              res = requests.get(url, headers=headers, impersonate="safari15_5", timeout=15)
              if res.status_code == 200 and len(res.text) > 100:
                  lines = res.text.splitlines()
                  cleaned_lines = [line for line in lines if not re.search(r"recommend", line, re.IGNORECASE)]
                  cleaned_content = "\n".join(cleaned_lines)
                  
                  # 1. 这里文件名改为 .lpx
                  with open("FleaMarket_clean.lpx", "w", encoding="utf-8") as f:
                      f.write(cleaned_content)
                  print("✅ 成功生成 FleaMarket_clean.lpx 文件！")
              else:
                  sys.exit(1)
          except Exception as e:
              sys.exit(1)
          '

      - name: Commit and push cleaned plugin
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 2. 这里也要改为 .lpx
          git add FleaMarket_clean.lpx
          git commit -m "Auto update: remove recommend rule" || exit 0
          git push
