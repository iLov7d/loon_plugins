name: Sync & Filter FleaMarket Plugin

on:
  schedule:
    # 每天 UTC 0:00 (北京时间 8:00) 自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download and clean plugin
        run: |
          # 参考你的规则，使用 -H 传入 "User-Agent: Loon" 伪装请求头
          curl -sSL -A "Loon" \
               -H "User-Agent: Loon" \
               -H "accept: */*" \
               "https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx" -o temp_plugin.plugin

          # 校验是否成功拉取到了文本内容（检测是否包含脚本或插件的关键字）
          if grep -q "recommend\.list" temp_plugin.plugin || grep -q "\[Plugin\]" temp_plugin.plugin || grep -q "\[Rewrite\]" temp_plugin.plugin || grep -q "http-response" temp_plugin.plugin; then
            echo "✅ 成功以 Loon 身份绕过 Cloudflare 拦截！正在剔除推荐栏目..."
            grep -v "recommend\.list" temp_plugin.plugin > FleaMarket_clean.plugin
          else
            echo "❌ 依然被拦截，准备输出返回内容前 20 行用于排查："
            head -n 20 temp_plugin.plugin
            exit 1
          fi

      - name: Commit and push cleaned plugin
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FleaMarket_clean.plugin
          git commit -m "Auto update: remove recommend.list rule" || exit 0
          git push
