name: Sync & Filter FleaMarket Plugin

on:
  schedule:
    # 每天 UTC 0:00 (北京時間 8:00) 自動運行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手動點擊觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download and clean plugin
        run: |
          # 傳入與截圖完全一致的特徵 User-Agent 繞過網站驗證
          curl -sSL -A "Loon/786 CFNetwork/1568.200.51 Darwin/24.1.0" \
               -H "User-Agent: Loon/786 CFNetwork/1568.200.51 Darwin/24.1.0" \
               -H "Accept: */*" \
               "https://kelee.one/Tool/Loon/Lpx/FleaMarket_remove_ads.lpx" -o temp_plugin.plugin

          # 檢查是否成功抓取文本內容
          if grep -q "recommend\.list" temp_plugin.plugin || grep -q "\[Plugin\]" temp_plugin.plugin || grep -q "\[Rewrite\]" temp_plugin.plugin; then
            echo "✅ 成功通過 kelee.one 的特徵 UA 驗證！正在剔除推薦欄目規則..."
            grep -v "recommend\.list" temp_plugin.plugin > FleaMarket_clean.plugin
          else
            echo "❌ 擷取失敗，列印回傳內容前 20 行以供排查："
            head -n 20 temp_plugin.plugin
            exit 1
          fi

      - name: Commit and push cleaned plugin
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add FleaMarket_clean.plugin
          git commit -m "Auto update: remove recommend.list rule via precise UA" || exit 0
          git push
